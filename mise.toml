[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"

[tools]
node = "lts"

[bootstrap.packages]
"brew-cask:ghostty" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew:git" = "latest"
"brew:gh" = "latest"
"brew:eza" = "latest"
"brew:micro" = "latest"
"brew:starship" = "latest"
"brew:mas" = "latest"
"mas:803453959" = "latest"      # Slack
"mas:6738274497" = "latest"     # Raycast AI companion

[bootstrap.macos.dock]
autohide = true
tilesize = 48
magnification = true
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true

[bootstrap.hooks.post-defaults]
run = """
echo "auth       sufficient     pam_tid.so" | sudo tee -a /etc/pam.d/sudo_local > /dev/null
defaults write com.apple.dock autohide-delay -float 0
defaults write com.apple.dock autohide-time-modifier -float 0.5
defaults write com.apple.dock largesize -int 64
killall Dock || true
"""

[tasks.bootstrap]
run = "node --version"
