[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"

[tools]
node = "lts"

[bootstrap.packages]
"brew-cask:ghostty" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew:git" = "latest"
"brew:gh" = "latest"
"brew:eza" = "latest"
"brew:micro" = "latest"
"brew:starship" = "latest"
"brew:mas" = "latest"           # Mac App Store CLI
"mas:803453959" = "latest"      # Slack
"mas:6738274497" = "latest"     # Raycast AI companion
"mas:1452453066" = "latest"     # Hidden bar

[bootstrap.macos.dock]
autohide = true
tilesize = 48
magnification = true
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true

# What this does:
# - Enables Touch ID for sudo
# - Disables dock autohide delay
# - Lowers dock auto-hide animation length
# - Sets dock magnification to a reasonable size
# - Clones zsh-defer
# - Restarts the dock
[bootstrap.hooks.post-defaults]
run = """
echo "auth       sufficient     pam_tid.so" | sudo tee -a /etc/pam.d/sudo_local > /dev/null
defaults write com.apple.dock autohide-delay -float 0
defaults write com.apple.dock autohide-time-modifier -float 0.5
defaults write com.apple.dock largesize -int 64
if [ ! -d ~/zsh-defer ]; then
  git clone https://github.com/romkatv/zsh-defer.git ~/zsh-defer
fi
mise use --global node@lts
killall Dock || true
"""

[dotfiles]
"~/.zshrc" = { source = "~/.dotfiles/zsh/.zshrc", mode = "symlink" }
"~/.zprofile" = { source = "~/.dotfiles/zsh/.zprofile", mode = "symlink" }
"~/.zshenv" = { source = "~/.dotfiles/zsh/.zshenv", mode = "symlink" }

[tasks.bootstrap]
run = "node --version"
